[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "math-tug"
version = "0.1.0"
description = "A landscape-first mobile math game mockup built with Python and Flet."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.0",
]

[tool.setuptools]
packages = ["math_tug"]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["math_tug", "app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
